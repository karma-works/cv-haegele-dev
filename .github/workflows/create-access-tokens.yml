name: Create access tokens

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of tokens to create
        required: true
        default: "5"
      label:
        description: Label prefix
        required: true
        default: invite
      expires_days:
        description: Days until expiry
        required: true
        default: "90"

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tokens
        shell: bash
        run: |
          set -euo pipefail
          count="${{ inputs.count }}"
          label="${{ inputs.label }}"
          expires_days="${{ inputs.expires_days }}"
          safe_label="$(printf '%s' "$label" | tr -c 'A-Za-z0-9._-' '-')"
          summary_file="$(mktemp)"
          echo "## CV access tokens" >> "$summary_file"
          echo "" >> "$summary_file"
          response="$(curl -fsS -X POST https://cv.haegele.dev/api/admin/create-tokens \
            -H "x-admin-token: ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"count\":${count},\"label\":\"${safe_label}\",\"expiresDays\":${expires_days}}")"
          printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const data=JSON.parse(s); for (const url of data.urls || []) console.log('- ' + url);})" >> "$summary_file"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
