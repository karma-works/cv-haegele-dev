name: Create access tokens

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of tokens to create
        required: true
        default: "5"
      label:
        description: Label prefix
        required: true
        default: invite
      expires_days:
        description: Days until expiry
        required: true
        default: "90"

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tokens
        shell: bash
        run: |
          set -euo pipefail
          count="${{ inputs.count }}"
          label="${{ inputs.label }}"
          expires_days="${{ inputs.expires_days }}"
          safe_label="$(printf '%s' "$label" | tr -c 'A-Za-z0-9._-' '-')"
          summary_file="$(mktemp)"
          token_file="tokens.txt"
          echo "## CV access tokens" >> "$summary_file"
          echo "" >> "$summary_file"
          node - "$count" "$safe_label" "$expires_days" "$ADMIN_TOKEN" "$summary_file" "$token_file" <<'NODE'
          const crypto = require('crypto');
          const [countRaw, label, daysRaw, secret, summaryFile, tokenFile] = process.argv.slice(2);
          const count = Math.min(Math.max(Number(countRaw || 1), 1), 50);
          const expiresAt = Date.now() + Number(daysRaw || 90) * 86400000;
          const lines = [];
          const b64 = (value) => Buffer.from(value).toString('base64url');
          for (let i = 1; i <= count; i += 1) {
            const payload = b64(JSON.stringify({
              typ: 'cv_invite',
              label: `${label}-${i}`,
              iat: Date.now(),
              exp: expiresAt,
              jti: crypto.randomBytes(18).toString('base64url')
            }));
            const sig = crypto.createHmac('sha256', secret).update(payload).digest('base64url');
            lines.push(`- https://cv.haegele.dev?token=${payload}.${sig}`);
          }
          require('fs').appendFileSync(summaryFile, lines.join('\n') + '\n');
          require('fs').writeFileSync(tokenFile, lines.join('\n') + '\n');
          console.log(lines.join('\n'));
          NODE
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Upload token artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-access-tokens
          path: tokens.txt
          retention-days: 1
