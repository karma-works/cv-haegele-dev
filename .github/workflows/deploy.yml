name: Deploy to Cloudflare

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set." >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set." >&2
            exit 1
          fi
          status="$(curl -sS -o /tmp/cf-token-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)"
          if [ "$status" != "200" ]; then
            cat /tmp/cf-token-verify.json >&2
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure optional Clerk settings
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLERK_JWKS_URL:-}" ]; then
            printf '%s' "$CLERK_JWKS_URL" | npx wrangler secret put CLERK_JWKS_URL
          fi
          node -e 'const fs=require("fs"); const p="wrangler.toml"; let s=fs.readFileSync(p,"utf8"); const set=(k,v)=>{ if(v) s=s.replace(new RegExp(`^${k} = .*`, "m"), `${k} = ${JSON.stringify(v)}`); }; set("CLERK_FRONTEND_API", process.env.CLERK_FRONTEND_API); set("CLERK_PUBLISHABLE_KEY", process.env.CLERK_PUBLISHABLE_KEY); fs.writeFileSync(p,s);'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_JWKS_URL: ${{ secrets.CLERK_JWKS_URL }}
          CLERK_FRONTEND_API: ${{ vars.CLERK_FRONTEND_API }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}

      - name: Configure admin token
        run: printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 schema through Worker binding
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST https://cv.haegele.dev/api/admin/apply-schema \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "Content-Type: application/json"
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
